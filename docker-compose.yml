services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL-http://minio:9000}
      - S3_PUBLIC_ENDPOINT_URL=${S3_PUBLIC_ENDPOINT_URL-http://localhost:9000}
      - S3_BROWSER_CORS_ORIGINS=${S3_BROWSER_CORS_ORIGINS-http://localhost:3000}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY-minioadmin}
      - S3_REGION=${S3_REGION}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL-amqp://firebim:firebim@rabbitmq:5672/firebim}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND-rpc://}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS-https://firebim.org,https://www.firebim.org,https://app.firebim.org,https://www.app.firebim.org,http://localhost:3000}
      - CHECKS_SOLVER=${CHECKS_SOLVER-standard}
      - SEED_DEMO_CONTENT=${SEED_DEMO_CONTENT-true}
      - GRAPH_SERVICE_URL=http://graph-service:7878
      - GRAPH_SERVICE_TOKEN=${GRAPH_SERVICE_TOKEN-}
      - AUTHENTIK_ISSUER_URL=http://100.95.221.15:9080/application/o/firebim/
      - AUTHENTIK_INTERNAL_URL=http://authentik-server:9000/application/o/firebim/
      - NEO_INGESTION_ENABLED=true
      - NEO_INGESTION_MAX_INPUT_BYTES=10000000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      authentik-server:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  celery-worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    environment:
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_REGION=${S3_REGION}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY-minioadmin}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL-amqp://firebim:firebim@rabbitmq:5672/firebim}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND-rpc://}
      - CHECKS_SOLVER=${CHECKS_SOLVER-standard}
      - GRAPH_SERVICE_URL=http://graph-service:7878
      - GRAPH_SERVICE_TOKEN=${GRAPH_SERVICE_TOKEN-}
    command: celery -A app.workers.celery_worker worker --loglevel=info --concurrency=1
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  upload-cleanup-beat:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    environment:
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL-http://minio:9000}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY-minioadmin}
      - S3_REGION=${S3_REGION}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL-amqp://firebim:firebim@rabbitmq:5672/firebim}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND-rpc://}
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule=/tmp/upload-cleanup-schedule
    depends_on:
      rabbitmq:
        condition: service_healthy

  neo-ingestion-worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
      target: neo-runtime
    environment: &neo-environment
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL-http://minio:9000}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY-minioadmin}
      S3_REGION: ${S3_REGION}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL-amqp://firebim:firebim@rabbitmq:5672/firebim}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND-rpc://}
    command: celery -A app.workers.celery_app worker -Q neo_ingestion --loglevel=info --concurrency=1 --prefetch-multiplier=1
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 805306368
    memswap_limit: 805306368
    tmpfs:
      - /tmp:size=16777216,uid=1001,gid=1001,mode=0700,noexec,nosuid,nodev
      - /app/ingestion-attempts:size=268435456,uid=1001,gid=1001,mode=0700,noexec,nosuid,nodev
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  neo-ingestion-dispatcher:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    environment: *neo-environment
    command: python -m app.workers.ingestion_dispatcher
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: firebim
      RABBITMQ_DEFAULT_PASS: firebim
      RABBITMQ_DEFAULT_VHOST: firebim
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  graph-service:
    profiles: ["translation-graphs"]
    build:
      context: .
      dockerfile: docker/graph-service/Dockerfile
    environment:
      - GRAPH_SERVICE_TOKEN=${GRAPH_SERVICE_TOKEN-}
      - GRAPH_SERVICE_DATA_DIR=/data
      - GRAPH_SERVICE_CGROUP_METRICS=1
    volumes:
      - graph_indexes:/data
    mem_limit: 6000000000
    memswap_limit: 6000000000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7878/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  graph-worker:
    profiles: ["translation-graphs"]
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL-http://minio:9000}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY-minioadmin}
      - S3_REGION=${S3_REGION}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL-amqp://firebim:firebim@rabbitmq:5672/firebim}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND-rpc://}
      - GRAPH_SERVICE_URL=http://graph-service:7878
      - GRAPH_SERVICE_TOKEN=${GRAPH_SERVICE_TOKEN-}
    command: celery -A app.workers.celery_app worker -Q graphs --loglevel=info --concurrency=1
    mem_limit: 2000000000
    memswap_limit: 2000000000
    depends_on:
      graph-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
#    ports:
#      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      # NOTE: Scripts in /docker-entrypoint-initdb.d run only when postgres_data is initialized the first time.
      # If you added Authentik DB/user creation here and already have an existing postgres_data volume,
      # you must either recreate the volume (e.g., `docker compose down -v`) or manually provision the
      # Authentik database and user before starting the stack.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: rustfs/rustfs:latest
    command: /data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY_ID-minioadmin}
      - RUSTFS_SECRET_KEY=${S3_SECRET_ACCESS_KEY-minioadmin}
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP

  authentik-server:
    image: ghcr.io/goauthentik/server:2025.12
    command: server
    ports:
      - "9080:9000"
      - "9443:9443"
    environment:
      AUTHENTIK_SECRET_KEY: local-dev-secret-key-change-in-production
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__PORT: 5432
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik-local-dev
      AUTHENTIK_BOOTSTRAP_PASSWORD: "Password123!"
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@firebim.local
      AUTHENTIK_EMAIL__HOST: mailpit
      AUTHENTIK_EMAIL__PORT: 1025
      AUTHENTIK_EMAIL__USE_TLS: "false"
      AUTHENTIK_EMAIL__USE_SSL: "false"
      AUTHENTIK_EMAIL__FROM: noreply@firebim.org
      AUTHENTIK_EMAIL__TIMEOUT: 10
      FIREBIM_CLIENT_ID: firebim
      FIREBIM_CLIENT_SECRET: local-dev-client-secret
      FIREBIM_REDIRECT_URI: "http://100.95.221.15:3000/api/auth/callback/authentik"
      FIREBIM_LAUNCH_URL: "http://100.95.221.15:3000"
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
      - ./blueprints:/blueprints/custom
    depends_on:
      postgres:
        condition: service_started
      mailpit:
        condition: service_started

  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.12
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: local-dev-secret-key-change-in-production
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__PORT: 5432
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik-local-dev
      AUTHENTIK_BOOTSTRAP_PASSWORD: "Password123!"
      AUTHENTIK_BOOTSTRAP_EMAIL: "admin@firebim.org"
      AUTHENTIK_BOOTSTRAP_TOKEN: "dev-api-token-not-for-production"
      AUTHENTIK_EMAIL__HOST: mailpit
      AUTHENTIK_EMAIL__PORT: 1025
      AUTHENTIK_EMAIL__USE_TLS: "false"
      AUTHENTIK_EMAIL__USE_SSL: "false"
      AUTHENTIK_EMAIL__FROM: noreply@firebim.org
      AUTHENTIK_EMAIL__TIMEOUT: 10
      FIREBIM_CLIENT_ID: firebim
      FIREBIM_CLIENT_SECRET: local-dev-client-secret
      FIREBIM_REDIRECT_URI: "http://100.95.221.15:3000/api/auth/callback/authentik"
      FIREBIM_LAUNCH_URL: "http://100.95.221.15:3000"
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
      - ./blueprints:/blueprints/custom
    depends_on:
      postgres:
        condition: service_started
      mailpit:
        condition: service_started

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@firebim.org
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_LISTEN_PORT=5050
    ports:
      - "5050:5050"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  graph_indexes:
  postgres_data:
  minio_data:
  pgadmin_data:
  rabbitmq_data:
  authentik_media:
  authentik_templates:
