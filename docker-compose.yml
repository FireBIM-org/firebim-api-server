services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports:
      - "8000:8000"
    # secrets:
    #   - db-password
    #   - s3-secret-key
    environment:
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL-http://minio:9000}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY-minioadmin}
      # TODO: Clean up duplicate env var names (e.g., S3_SECRET_ACCESS_KEY vs s3-secret-access-key), also for worker.
      # Use consistent secret files.
      # - s3-secret-access-key=minioadmin
      - S3_REGION=${S3_REGION}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # - db-password=postgres
      - CELERY_BROKER_URL=${CELERY_BROKER_URL-amqp://firebim:firebim@rabbitmq:5672/firebim}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND-rpc://}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS-https://firebim.org,https://www.firebim.org,https://app.firebim.org,https://www.app.firebim.org,http://localhost:3000}
      - FUSEKI_HOST=${FUSEKI_HOST-http://fuseki:3030}
      - FUSEKI_APP_USER=${FUSEKI_APP_USER-${FUSEKI_USER-admin}}
      - FUSEKI_APP_PASSWORD=${FUSEKI_APP_PASSWORD-${FUSEKI_PASSWORD-admin}}
      - CHECKS_SOLVER=${CHECKS_SOLVER-standard}
      # Public issuer URL (matches the iss claim in tokens issued via the browser)
      - AUTHENTIK_ISSUER_URL=http://localhost:9090/application/o/firebim/
      # Internal URL for JWKS fetching from inside the Docker network
      - AUTHENTIK_INTERNAL_URL=http://authentik-server:9000/application/o/firebim/
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      authentik-server:
        condition: service_started
      fuseki:
        condition: service_healthy
      fuseki-init:
        condition: service_completed_successfully

  celery-worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    # secrets:
    #   - db-password
    #   - s3-secret-key
    environment:
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL-http://minio:9000}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_REGION=${S3_REGION}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY-minioadmin}
      # - s3-secret-access-key=minioadmin
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # - db-password=postgres
      - CELERY_BROKER_URL=${CELERY_BROKER_URL-amqp://firebim:firebim@rabbitmq:5672/firebim}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND-rpc://}
      - FUSEKI_HOST=${FUSEKI_HOST-http://fuseki:3030}
      - FUSEKI_APP_USER=${FUSEKI_APP_USER-${FUSEKI_USER-admin}}
      - FUSEKI_APP_PASSWORD=${FUSEKI_APP_PASSWORD-${FUSEKI_PASSWORD-admin}}
      - CHECKS_SOLVER=${CHECKS_SOLVER-standard}
    command: celery -A app.workers.celery_worker worker --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      fuseki:
        condition: service_healthy
      fuseki-init:
        condition: service_completed_successfully

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: firebim
      RABBITMQ_DEFAULT_PASS: firebim
      RABBITMQ_DEFAULT_VHOST: firebim
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      # test: ["CMD", "rabbitmqctl", "status"]
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    # secrets:
    #   - db-password
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # NOTE: Scripts in /docker-entrypoint-initdb.d run only when postgres_data is initialized the first time.
      # If you added Authentik DB/user creation here and already have an existing postgres_data volume,
      # you must either recreate the volume (e.g., `docker compose down -v`) or manually provision the
      # Authentik database and user before starting the stack.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5


  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-ec"]
    command:
      [
        'until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done; /usr/bin/mc mb --ignore-existing local/${S3_BUCKET_NAME}; echo "MinIO bucket ready: ${S3_BUCKET_NAME}";',
      ]

  # ── Mailpit (local email catcher) ────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"    # Web UI
      - "1025:1025"    # SMTP

  # ── Authentik (local identity provider) ─────────────────────────
  authentik-server:
    image: ghcr.io/goauthentik/server:2025.12
    command: server
    ports:
      - "9090:9000"    # HTTP
      - "9443:9443"    # HTTPS
    environment:
      AUTHENTIK_SECRET_KEY: local-dev-secret-key-change-in-production
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__PORT: 5432
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik-local-dev
      AUTHENTIK_BOOTSTRAP_PASSWORD: akadmin
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@firebim.org
      # SMTP — local Mailpit
      AUTHENTIK_EMAIL__HOST: mailpit
      AUTHENTIK_EMAIL__PORT: 1025
      AUTHENTIK_EMAIL__USE_TLS: "false"
      AUTHENTIK_EMAIL__USE_SSL: "false"
      AUTHENTIK_EMAIL__FROM: noreply@firebim.org
      AUTHENTIK_EMAIL__TIMEOUT: 10
      # Blueprint env vars
      FIREBIM_CLIENT_ID: firebim
      FIREBIM_CLIENT_SECRET: local-dev-client-secret
      FIREBIM_REDIRECT_URI: "http://localhost:3000/api/auth/callback/authentik"
      FIREBIM_LAUNCH_URL: "http://localhost:3000"
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
      - ./blueprints:/blueprints/custom
    depends_on:
      postgres:
        condition: service_started
      mailpit:
        condition: service_started

  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.12
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: local-dev-secret-key-change-in-production
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__PORT: 5432
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik-local-dev
      # Authentik Bootstrap
      AUTHENTIK_BOOTSTRAP_PASSWORD: "Password123!"
      AUTHENTIK_BOOTSTRAP_EMAIL: "admin@firebim.local"
      AUTHENTIK_BOOTSTRAP_TOKEN: "dev-api-token-not-for-production"
      # SMTP — local Mailpit
      AUTHENTIK_EMAIL__HOST: mailpit
      AUTHENTIK_EMAIL__PORT: 1025
      AUTHENTIK_EMAIL__USE_TLS: "false"
      AUTHENTIK_EMAIL__USE_SSL: "false"
      AUTHENTIK_EMAIL__FROM: noreply@firebim.org
      AUTHENTIK_EMAIL__TIMEOUT: 10
      FIREBIM_CLIENT_ID: firebim
      FIREBIM_CLIENT_SECRET: local-dev-client-secret
      FIREBIM_REDIRECT_URI: "http://localhost:3000/api/auth/callback/authentik"
      FIREBIM_LAUNCH_URL: "http://localhost:3000"
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
      - ./blueprints:/blueprints/custom
    depends_on:
      postgres:
        condition: service_started
      mailpit:
        condition: service_started

  # ── Apache Jena Fuseki (SPARQL triplestore) ────────────────────
  fuseki:
    image: stain/jena-fuseki:latest
    ports:
      - "3030:3030"
    environment:
      - FUSEKI_DATASET_1=firebim
      - ADMIN_PASSWORD=admin
    volumes:
      - fuseki_data:/fuseki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3030/$/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  fuseki-init:
    image: curlimages/curl:8.13.0
    depends_on:
      fuseki:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command: 'datasets_url="http://fuseki:3030/\$$/datasets"; until curl -fsS -u admin:admin "$$datasets_url" >/dev/null; do sleep 2; done; for dataset in buildings rulebook; do if ! curl -fsS -u admin:admin "$$datasets_url" | grep -q "\"ds.name\"[[:space:]]*:[[:space:]]*\"/$$dataset\""; then curl -fsS -u admin:admin -X POST "$$datasets_url" -d "dbName=$$dataset" -d "dbType=tdb2" >/dev/null; echo "Created Fuseki dataset: $$dataset"; else echo "Fuseki dataset already exists: $$dataset"; fi; done;'

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@firebim.org
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_LISTEN_PORT=5050
    ports:
      - "5050:5050"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  postgres_data:
  minio_data:
  pgadmin_data:
  rabbitmq_data:
  authentik_media:
  authentik_templates:
  fuseki_data:

