services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports:
      - "8000:8000"
    secrets:
      - db-password
      - s3-secret-key
    environment:
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL-http://minio:9000}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY_FILE=/run/secrets/s3-secret-key
      - S3_REGION=${S3_REGION}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
      - POSTGRES_DB=${POSTGRES_DB}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL-amqp://guest:guest@rabbitmq:5672//}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND-rpc://}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS-https://firebim.org,https://www.firebim.org,https://app.firebim.org,https://www.app.firebim.org,http://localhost:3000}
      - FUSEKI_HOST=${FUSEKI_HOST-http://graph-demo.firebim.org:3030}
      - AUTHENTIK_ISSUER_URL=http://localhost:9090/application/o/firebim/
    volumes:
      - ./app:/app
    depends_on:
      - postgres
      - minio
      - rabbitmq

  celery-worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    secrets:
      - db-password
      - s3-secret-key
    environment:
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL-http://minio:9000}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY_FILE=/run/secrets/s3-secret-key
      - S3_REGION=${S3_REGION}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
      - POSTGRES_DB=${POSTGRES_DB}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL-amqp://guest:guest@rabbitmq:5672//}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND-rpc://}
    volumes:
      - ./app:/app
    depends_on:
      - minio
      - rabbitmq
      - postgres
    command: celery -A app.workers.celery_worker worker --loglevel=info

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"  # AMQP protocol
      - "15672:15672"  # Management interface
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    secrets:
      - db-password
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data

  # ── Authentik (local identity provider) ─────────────────────────
  authentik-server:
    image: ghcr.io/goauthentik/server:2025.2.1
    command: server
    ports:
      - "9090:9000"    # HTTP
      - "9443:9443"    # HTTPS
    environment:
      AUTHENTIK_SECRET_KEY: local-dev-secret-key-change-in-production
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__PORT: 5432
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik-local-dev
      AUTHENTIK_BOOTSTRAP_PASSWORD: akadmin
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@firebim.org
      # Blueprint env vars
      FIREBIM_CLIENT_ID: firebim
      FIREBIM_CLIENT_SECRET: local-dev-client-secret
      FIREBIM_REDIRECT_URIS: "http://localhost:3000/api/auth/callback/authentik\nhttp://localhost:8000/api/auth/callback/authentik"
      FIREBIM_LAUNCH_URL: "http://localhost:3000"
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
      - ./blueprints:/blueprints/custom
    depends_on:
      postgres:
        condition: service_started

  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.2.1
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: local-dev-secret-key-change-in-production
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__PORT: 5432
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik-local-dev
      FIREBIM_CLIENT_ID: firebim
      FIREBIM_CLIENT_SECRET: local-dev-client-secret
      FIREBIM_REDIRECT_URIS: "http://localhost:3000/api/auth/callback/authentik\nhttp://localhost:8000/api/auth/callback/authentik"
      FIREBIM_LAUNCH_URL: "http://localhost:3000"
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
      - ./blueprints:/blueprints/custom
    depends_on:
      postgres:
        condition: service_started

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@firebim.org
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_LISTEN_PORT=5050
    ports:
      - "5050:5050"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  postgres_data:
  minio_data:
  pgadmin_data:
  rabbitmq_data:
  authentik_media:
  authentik_templates:

secrets:
  db-password:
    # external: true
    file: secrets/db_password
  s3-secret-key:
    file: secrets/s3_secret_key
  # secret-key:
  #   file: secrets/secret_key

