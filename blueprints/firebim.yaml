version: 1
metadata:
  name: FireBIM Application
  labels:
    blueprints.goauthentik.io/description: "OAuth2/OIDC provider and application for the FireBIM platform"
    blueprints.goauthentik.io/instantiate: "true"

context:
  firebim_client_id: !Env [FIREBIM_CLIENT_ID, firebim]
  firebim_redirect_uri: !Env [FIREBIM_REDIRECT_URI, "http://localhost:3000/api/auth/callback/authentik"]
  firebim_launch_url: !Env [FIREBIM_LAUNCH_URL, "http://localhost:3000"]

entries:
  # ──────────────────────────────────────────────
  # OAuth2 / OpenID Connect Provider
  # ──────────────────────────────────────────────
  - model: authentik_providers_oauth2.oauth2provider
    id: firebim-provider
    state: present
    identifiers:
      name: FireBIM
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: !Context firebim_client_id
      client_secret: !Env [FIREBIM_CLIENT_SECRET, ""]
      redirect_uris:
        - matching_mode: strict
          url: !Context firebim_redirect_uri
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      issuer_mode: per_provider
      access_code_validity: "minutes=1"
      access_token_validity: "minutes=5"
      refresh_token_validity: "days=30"

  # ──────────────────────────────────────────────
  # Application (visible on the Authentik dashboard)
  # ──────────────────────────────────────────────
  - model: authentik_core.application
    id: firebim-app
    state: present
    identifiers:
      slug: firebim
    attrs:
      name: FireBIM
      provider: !KeyOf firebim-provider
      meta_launch_url: !Context firebim_launch_url
      meta_description: "FireBIM - IFC/IDS Compliance Checking Platform"
      policy_engine_mode: any
