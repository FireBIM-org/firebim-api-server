version: 1
metadata:
  name: FireBIM Application
  labels:
    blueprints.goauthentik.io/description: "OAuth2/OIDC provider and application for the FireBIM platform"
    blueprints.goauthentik.io/instantiate: "true"

context:
  firebim_client_id: !Env [FIREBIM_CLIENT_ID, firebim]
  firebim_redirect_uris: !Env [FIREBIM_REDIRECT_URIS, "http://localhost:3000/api/auth/callback/authentik"]
  firebim_launch_url: !Env [FIREBIM_LAUNCH_URL, "http://localhost:3000"]

entries:
  # ──────────────────────────────────────────────
  # Enrollment flow — allows users to self-register
  # ──────────────────────────────────────────────
  - model: authentik_flows.flow
    id: firebim-enrollment-flow
    state: present
    identifiers:
      slug: firebim-enrollment
    attrs:
      name: FireBIM Self-Enrollment
      title: Create a FireBIM Account
      designation: enrollment
      authentication: require_unauthenticated

  - model: authentik_stages_prompt.prompt
    id: prompt-field-username
    state: present
    identifiers:
      field_key: username
    attrs:
      label: Username
      type: username
      required: true
      placeholder: Choose a username
      order: 0

  - model: authentik_stages_prompt.prompt
    id: prompt-field-email
    state: present
    identifiers:
      field_key: email
    attrs:
      label: Email
      type: email
      required: true
      placeholder: your@email.com
      order: 1

  - model: authentik_stages_prompt.prompt
    id: prompt-field-password
    state: present
    identifiers:
      field_key: password
    attrs:
      label: Password
      type: password
      required: true
      placeholder: Choose a password
      order: 2

  - model: authentik_stages_prompt.prompt
    id: prompt-field-password-repeat
    state: present
    identifiers:
      field_key: password_repeat
    attrs:
      label: Repeat Password
      type: password
      required: true
      placeholder: Confirm your password
      order: 3

  - model: authentik_stages_prompt.promptstage
    id: firebim-enrollment-prompt-stage
    state: present
    identifiers:
      name: firebim-enrollment-prompt
    attrs:
      fields:
        - !KeyOf prompt-field-username
        - !KeyOf prompt-field-email
        - !KeyOf prompt-field-password
        - !KeyOf prompt-field-password-repeat
      validation_policies: []

  - model: authentik_stages_user_write.userwritestage
    id: firebim-enrollment-user-write
    state: present
    identifiers:
      name: firebim-enrollment-user-write
    attrs:
      create_users_as_inactive: false
      user_creation_mode: always_create

  - model: authentik_stages_user_login.userloginstage
    id: firebim-enrollment-user-login
    state: present
    identifiers:
      name: firebim-enrollment-user-login

  - model: authentik_flows.flowstagebinding
    id: firebim-enrollment-binding-0
    state: present
    identifiers:
      target: !KeyOf firebim-enrollment-flow
      stage: !KeyOf firebim-enrollment-prompt-stage
      order: 10

  - model: authentik_flows.flowstagebinding
    id: firebim-enrollment-binding-1
    state: present
    identifiers:
      target: !KeyOf firebim-enrollment-flow
      stage: !KeyOf firebim-enrollment-user-write
      order: 20

  - model: authentik_flows.flowstagebinding
    id: firebim-enrollment-binding-2
    state: present
    identifiers:
      target: !KeyOf firebim-enrollment-flow
      stage: !KeyOf firebim-enrollment-user-login
      order: 30

  # ──────────────────────────────────────────────
  # OAuth2 / OpenID Connect Provider
  # ──────────────────────────────────────────────
  - model: authentik_providers_oauth2.oauth2provider
    id: firebim-provider
    state: present
    identifiers:
      name: FireBIM
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: !Context firebim_client_id
      client_secret: !Env [FIREBIM_CLIENT_SECRET, ""]
      redirect_uris: !Context firebim_redirect_uris
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      issuer_mode: per_provider
      access_code_validity: "minutes=10"
      access_token_validity: "minutes=5"
      refresh_token_validity: "days=30"

  # ──────────────────────────────────────────────
  # Application (visible on the Authentik dashboard)
  # ──────────────────────────────────────────────
  - model: authentik_core.application
    id: firebim-app
    state: present
    identifiers:
      slug: firebim
    attrs:
      name: FireBIM
      provider: !KeyOf firebim-provider
      meta_launch_url: !Context firebim_launch_url
      meta_description: "FireBIM - IFC/IDS Compliance Checking Platform"
      policy_engine_mode: any

  # ──────────────────────────────────────────────
  # Connect enrollment flow to the default login page
  # ──────────────────────────────────────────────
  - model: authentik_stages_identification.identificationstage
    state: present
    identifiers:
      name: default-authentication-identification
    attrs:
      enrollment_flow: !KeyOf firebim-enrollment-flow
