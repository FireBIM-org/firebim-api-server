[project]
name = "firebim-api-server"
version = "0.1.0"
description = "FireBIM API Server monorepo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
firebim-common = { workspace = true }
firebim-api = { workspace = true }
firebim-worker = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "aiosqlite>=0.20",
    "pytest-cov>=6.0",
    "firebim-common",
    "firebim-api",
    "firebim-worker",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # Allow function calls in FastAPI default arguments
