[project]
name = "firebim-api-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "fastapi-cli",
    "uvicorn==0.54.0",
    "pydantic==2.14.2",
    "python-multipart>=0.0.32",
    "boto3==1.43.122",
    "psycopg2-binary==2.9.13",
    "sqlmodel==0.0.48",
    "alembic==1.20.1",
    "httpx==0.28.1",
    "uuid==1.30",
    "pyjwt[crypto]>=2.13.0",
    "email-validator==2.3.0",
    "pydantic-settings",
    "celery==5.6.3",
    "rdflib==7.6.0",
    "requests>=2.31.0",
    "pydevd-pycharm>=262.8665.186",
    "pyshacl>=0.40.1",
]



[dependency-groups]
dev = [
    "ruff>=0.16.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "aiosqlite>=0.20",
    "pytest-cov>=6.0",
]
worker = [
    "ifcopenshell==0.9.0",
    "ifctester==0.9.0",
    "bcf-client==0.9.0",
]


[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # Allow function calls in FastAPI default arguments


[tool.pytest.ini_options]
markers = [
    "integration: tests that require a running FireBIM API and backing services",
]
