[project]
name = "firebim-api-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "fastapi-cli",
    "uvicorn==0.27.1",
    "pydantic==2.6.3",
    "python-multipart>=0.0.22",
    "boto3==1.34.72",
    "psycopg2-binary==2.9.9",
    "sqlmodel==0.0.24",
    "alembic==1.13.1",
    "httpx==0.27.0",
    "uuid==1.30",
    "pyjwt[crypto]>=2.12.0",
    "email-validator==2.1.0",
    "pydantic-settings",
    "celery==5.3.6",
    "rdflib==7.3.0",
    "pyshacl==0.25.0",
    "networkx==3.2.1",
]



[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "aiosqlite>=0.20",
    "pytest-cov>=6.0",
]
worker = [
    "ifcopenshell==0.8.1.post1",
    "ifctester==0.8.1",
    "bcf-client==0.8.1",
]


[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # Allow function calls in FastAPI default arguments
