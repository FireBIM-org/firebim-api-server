[project]
name = "firebim-api-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "fastapi-cli",
    "uvicorn==0.47.0",
    "pydantic==2.13.4",
    "python-multipart>=0.0.29",
    "boto3==1.43.10",
    "psycopg2-binary==2.9.12",
    "sqlmodel==0.0.38",
    "alembic==1.18.4",
    "httpx==0.28.1",
    "uuid==1.30",
    "pyjwt[crypto]>=2.12.1",
    "email-validator==2.3.0",
    "pydantic-settings",
    "celery==5.6.3",
    "rdflib==7.6.0",
]



[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "aiosqlite>=0.20",
    "pytest-cov>=6.0",
    "requests>=2.31.0",
]
worker = [
    "ifcopenshell==0.8.5",
    "ifctester==0.8.5",
    "bcf-client==0.8.5",
]


[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # Allow function calls in FastAPI default arguments

[tool.pytest.ini_options]
markers = [
    "integration: tests that require a running FireBIM API and backing services",
]
