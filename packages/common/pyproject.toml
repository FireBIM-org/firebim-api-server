[project]
name = "firebim-common"
version = "0.1.0"
description = "Shared models, config, and utilities for FireBIM services"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6.3",
    "pydantic-settings>=2.0",
    "sqlmodel>=0.0.24",
    "psycopg2-binary>=2.9.9",
    "celery>=5.3.6",
    "email-validator>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firebim_common"]
