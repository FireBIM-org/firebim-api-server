[project]
name = "firebim-api"
version = "0.1.0"
description = "FireBIM FastAPI backend service"
requires-python = ">=3.12"
dependencies = [
    "firebim-common",
    "fastapi>=0.115.0",
    "fastapi-cli>=0.0.5",
    "uvicorn>=0.27.1",
    "python-multipart>=0.0.22",
    "boto3>=1.34.72",
    "httpx>=0.27.0",
    "uuid>=1.30",
    "pyjwt[crypto]>=2.12.0",
    "rdflib>=7.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firebim_api"]

[tool.uv.sources]
firebim-common = { workspace = true }
