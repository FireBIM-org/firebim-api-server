[project]
name = "firebim-worker"
version = "0.1.0"
description = "FireBIM Celery worker for IFC processing"
requires-python = ">=3.12"
dependencies = [
    "firebim-common",
    "boto3>=1.34.72",
    "ifcopenshell>=0.8.1.post1",
    "ifctester>=0.8.1",
    "bcf-client>=0.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firebim_worker"]

[tool.uv.sources]
firebim-common = { workspace = true }
