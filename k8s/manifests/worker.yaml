apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-config
  namespace: firebim
data:
  S3_ENDPOINT_URL: "http://minio:9000"
  S3_ACCESS_KEY_ID: "minioadmin"
  S3_SECRET_ACCESS_KEY: "minioadmin"
  S3_REGION: "us-east-1"
  S3_BUCKET_NAME: "firebim"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: firebim
spec:
  replicas: 3  # Multiple workers for parallel processing
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: firebim/worker:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: worker-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: worker-service
  namespace: firebim
spec:
  selector:
    app: worker
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP